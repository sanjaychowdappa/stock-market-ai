version: "3.9"

services:
  # ── Rust Backend (high-performance) ──────────────────────────
  backend:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=stock_market_ai=info
      - NVIDIA_VISIBLE_DEVICES=all
    depends_on:
      - redis
    volumes:
      - model_data:/app/model_cache
      - ./reports:/app/reports
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Python Fine-Tune Sidecar (GPU, wakes at EOD) ────────────
  finetune-sidecar:
    build:
      context: ./backend-rust/finetune-sidecar
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/app/model_cache
    volumes:
      - model_data:/app/model_cache
      - ./backend-rust/scripts:/app/scripts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Python Backend (legacy, kept for fallback) ───────────────
  backend-python:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/model_cache
      - NVIDIA_VISIBLE_DEVICES=all
    depends_on:
      - redis
    volumes:
      - model_data:/app/model_cache
      - ./backend/app:/app/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    profiles: ["legacy"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  model_data:
