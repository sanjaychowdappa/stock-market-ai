version: "3.9"

services:
  # ── Rust Backend (high-performance) ──────────────────────────
  backend:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RUST_LOG=stock_market_ai=info
    volumes:
      - model_data:/app/model_cache
      - ./reports:/app/reports
    # NOT unless-stopped: that restarts containers whenever the Docker daemon
    # starts, including on a weekend when the machine is switched on for
    # something else. auto_start.bat is the only thing that should start this
    # stack, and it runs weekdays before the open. on-failure still recovers a
    # crash during a session, which is the case worth restarting for.
    restart: on-failure:3

  # ── Python Fine-Tune + Agent Sidecar (GPU) ───────────────────
  # Kronos inference on :8001, ML Agent predictions on :8002
  finetune-sidecar:
    build:
      context: ./backend-rust/finetune-sidecar
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/app/model_cache
    volumes:
      - model_data:/app/model_cache
      - ./backend-rust/scripts:/app/scripts
      - ./reports:/app/reports
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # NOT unless-stopped: that restarts containers whenever the Docker daemon
    # starts, including on a weekend when the machine is switched on for
    # something else. auto_start.bat is the only thing that should start this
    # stack, and it runs weekdays before the open. on-failure still recovers a
    # crash during a session, which is the case worth restarting for.
    restart: on-failure:3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    # NOT unless-stopped: that restarts containers whenever the Docker daemon
    # starts, including on a weekend when the machine is switched on for
    # something else. auto_start.bat is the only thing that should start this
    # stack, and it runs weekdays before the open. on-failure still recovers a
    # crash during a session, which is the case worth restarting for.
    restart: on-failure:3

# redis removed: nothing ever connected to it. No redis crate in Cargo.toml,
# no code path referencing REDIS_URL — the container held a port and a volume
# for no consumer.

volumes:
  model_data:
